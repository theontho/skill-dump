DESCRIPTION="CPU/RAM/disk leases, named locks and messages between agents"
BINS="agent-coord=agent_coord.py"
UNITS="agent-coord.service"
# Restarted when this tool's files change; clients retry while it restarts.
RESTART_ON_CHANGE="agent-coord.service"
REQUIRES="python3 systemctl"
OS="Linux Windows"
# Windows has no systemd: "agent-coord service install|restart|uninstall"
# starts it at logon instead (clients also start it on demand).
WINDOWS_SERVICE="agent-coord"
