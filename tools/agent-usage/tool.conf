DESCRIPTION="Counts-only daily agent token usage and tokens per merged PR"
BINS="agent-usage=agent-usage"
REQUIRES="python3"
INSTALL_ONLY=yes
if [[ $(uname -s) == Linux ]]; then
  UNITS="agent-usage.service agent-usage.timer"
elif [[ $(uname -s) == Darwin ]]; then
  PLISTS="com.theontho.agent-usage.plist"
fi
